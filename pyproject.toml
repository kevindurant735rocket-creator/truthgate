[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truthgate"
version = "0.1.0"
description = "A deterministic verification gate that catches its own constant-true checks and reports its own false-positive rate."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "truthgate contributors" }]
keywords = [
    "verification",
    "ci",
    "testing",
    "agent",
    "llm",
    "gate",
    "calibration",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Intentionally empty. A verification gate you cannot audit is a gate you
# cannot trust; there is no transitive dependency tree to reason about.
dependencies = []

[project.urls]
Homepage = "https://github.com/truthgate/truthgate"
Repository = "https://github.com/truthgate/truthgate"
Issues = "https://github.com/truthgate/truthgate/issues"

[project.scripts]
truthgate = "truthgate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["truthgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
